name: Uppdatera IT-jobb dagligen

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v3

      # Actions kör på Node 24, men runnern kör fortfarande Node 18.
      # Detta steg byter Node-version för själva runnern.
      - name: Force Node 24 for runner
        run: |
          sudo npm install -g n
          sudo n 24
          node -v

      - name: Installera beroenden
        run: npm install node-fetch@3

      - name: Kör jobbhämtaren
        run: node fetch_jobs.js

      - name: Commit & push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add jobs.json
          git commit -m "Uppdaterade jobb"
          git push
