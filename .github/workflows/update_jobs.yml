name: Uppdatera IT-jobb dagligen

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Ställ in Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kör jobbhämtaren
        run: node fetch_jobs.js

      - name: Commit & push ändringar
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --staged --quiet || git commit -m "Uppdaterade jobb [skip ci]"
          git push
          
